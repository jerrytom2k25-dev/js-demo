
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专注番茄钟 - 高效时间管理</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.5s ease;
        }

        /* 动态背景色 */
        .bg-work { background: linear-gradient(135deg, #ff6b6b 0%, #ee5253 100%); }
        .bg-short-break { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .bg-long-break { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }

        /* 计时器圆环动画 */
        .timer-circle {
            transition: stroke-dashoffset 1s linear;
        }

        /* 任务项动画 */
        .task-item {
            transition: all 0.3s ease;
        }
        .task-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-work min-h-screen text-white flex flex-col items-center justify-center p-4 selection:bg-white selection:text-red-500">

    <!-- 主容器 -->
    <div class="w-full max-w-md bg-white/10 backdrop-blur-lg rounded-3xl shadow-2xl overflow-hidden border border-white/20">
        
        <!-- 头部：模式切换 -->
        <div class="flex justify-between items-center p-6 pb-2">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-clock text-2xl opacity-90"></i>
                <h1 class="text-xl font-bold tracking-wide">Pomodoro</h1>
            </div>
            <button id="settings-btn" class="p-2 hover:bg-white/20 rounded-full transition-colors">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>

        <!-- 模式标签 -->
        <div class="flex justify-center gap-2 mb-6 px-6">
            <button onclick="app.switchMode('work')" id="btn-work" class="mode-btn px-4 py-1 rounded-full bg-white/20 font-semibold text-sm transition-all hover:bg-white/30">专注</button>
            <button onclick="app.switchMode('shortBreak')" id="btn-short" class="mode-btn px-4 py-1 rounded-full bg-transparent font-semibold text-sm transition-all hover:bg-white/10 opacity-70">短休息</button>
            <button onclick="app.switchMode('longBreak')" id="btn-long" class="mode-btn px-4 py-1 rounded-full bg-transparent font-semibold text-sm transition-all hover:bg-white/10 opacity-70">长休息</button>
        </div>

        <!-- 计时器显示区域 -->
        <div class="flex flex-col items-center justify-center py-8 relative">
            <!-- SVG 圆环进度条 -->
            <div class="relative w-64 h-64">
                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                    <!-- 背景圆环 -->
                    <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />
                    <!-- 进度圆环 -->
                    <circle id="progress-ring" cx="50" cy="50" r="45" fill="none" stroke="white" stroke-width="4" 
                            stroke-dasharray="283" stroke-dashoffset="0" stroke-linecap="round" class="timer-circle" />
                </svg>
                <!-- 时间文字 -->
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <span id="timer-display" class="text-6xl font-bold tabular-nums drop-shadow-md">25:00</span>
                    <span id="status-text" class="text-sm uppercase tracking-widest mt-2 opacity-80">准备专注</span>
                </div>
            </div>
            
            <!-- 控制按钮 -->
            <div class="mt-8 flex gap-4">
                <button id="reset-btn" class="w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition-all" title="重置">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
                <button id="toggle-btn" class="w-20 h-20 rounded-2xl bg-white text-red-500 text-3xl flex items-center justify-center shadow-lg hover:scale-105 transition-transform" title="开始/暂停">
                    <i class="fa-solid fa-play pl-1" id="play-icon"></i>
                </button is>
                <button id="skip-btn" class="w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition-all" title="跳过">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
            </div>
        </div>

        <!-- 任务管理区域 -->
        <div class="bg-white/5 border-t border-white/10 p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold"><i class="fa-solid fa-list-check mr-2"></i>待办任务</h2>
                <span id="total-pomodoros" class="text-xs bg-black/20 px-2 py-1 rounded">今日完成: 0 🍅</span>
            </div>

            <!-- 添加任务输入框 -->
            <div class="flex gap-2 mb-4">
                <input type="text" id="task-input" placeholder="添加新任务..." 
                       class="flex-1 bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-white placeholder-white/50 focus:outline-none focus:bg-white/20 transition-colors">
                <button onclick="app.addTask()" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg transition-colors">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <!-- 任务列表 -->
            <ul id="task-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                <!-- 任务项将通过JS动态生成 -->
                <li class="text-center text-white/50 py-4 text-sm italic" id="empty-state">
                    暂无任务，添加一个开始专注吧！
                </li>
            </ul>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="mt-6 text-white/60 text-xs text-center">
        <p>保持专注 · 高效工作 · 适度休息</p>
    </footer>

    <script>
        /**
         * 番茄钟应用逻辑
         */
        const app = {
            // 配置
            config: {
                work: 25 * 60,
                shortBreak: 5 * 60,
                longBreak: 15 * 60,
                roundsBeforeLongBreak: 4
            },
            
            // 状态
            state: {
                mode: 'work', // work, shortBreak, longBreak
                timeLeft: 25 * 60,
                isRunning: false,
                timerId: null,
                completedRounds: 0,
                totalPomodoros: 0,
                tasks: [],
                activeTaskId: null
            },

            // DOM 元素缓存
            elements: {
                timerDisplay: document.getElementById('timer-display'),
                statusText: document.getElementById('status-text'),
                progressRing: document.getElementById('progress-ring'),
                toggleBtn: document.getElementById('toggle-btn'),
                playIcon: document.getElementById('play-icon'),
                resetBtn: document.getElementById('reset-btn'),
                skipBtn: document.getElementById('skip-btn'),
                taskInput: document.getElementById('task-input'),
                taskList: document.getElementById('task-list'),
                emptyState: document.getElementById('empty-state'),
                totalPomodoros: document.getElementById('total-pomodoros'),
                body: document.body,
                btnWork: document.getElementById('btn-work'),
                btnShort: document.getElementById('btn-short'),
                btnLong: document.getElementById('btn-long')
            },

            // 初始化
            init() {
                this.loadData();
                this.setupEventListeners();
                this.updateDisplay();
                this.renderTasks();
                this.requestNotificationPermission();
            },

            // 设置事件监听
            setupEventListeners() {
                // 开始/暂停
                this.elements.toggleBtn.addEventListener('click', () => this.toggleTimer());
                
                // 重置
                this.elements.resetBtn.addEventListener('click', () => this.resetTimer());
                
                // 跳过
                this.elements.skipBtn.addEventListener('click', () => this.completeTimer());
                
                // 输入框回车
                this.elements.taskInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTask();
                });

                // 请求通知权限
                if ('Notification' in window) {
                    Notification.requestPermission();
                }
            },

            // 切换计时器状态
            toggleTimer() {
                if (this.state.isRunning) {
                    this.pauseTimer();
                } else {
                    this.startTimer();
                }
            },

            // 开始计时
            startTimer() {
                if (this.state.isRunning) return;
                
                this.state.isRunning = true;
                this.updatePlayIcon();
                this.elements.statusText.textContent = this.state.mode === 'work' ? '专注中...' : '休息中...';
                
                this.state.timerId = setInterval(() => {
                    if (this.state.timeLeft > 0) {
                        this.state.timeLeft--;
                        this.updateDisplay();
                    } else {
                        this.completeTimer();
                    }
                }, 1000);
            },

            // 暂停计时
            pauseTimer() {
                this.state.isRunning = false;
                clearInterval(this.state.timerId);
                this.updatePlayIcon();
                this.elements.statusText.textContent = '已暂停';
            },

            // 重置计时
            resetTimer() {
                this.pauseTimer();
                this.state.timeLeft = this.config[this.state.mode];
                this.updateDisplay();
                this.elements.statusText.textContent = '准备就绪';
            },

            // 完成当前计时（自动跳转或手动跳过）
            completeTimer() {
                this.pauseTimer();
                
                // 播放提示音（可选，这里用视觉反馈代替）
                this.showNotification();

                if (this.state.mode === 'work') {
                    this.state.completedRounds++;
                    this.state.totalPomodoros++;
                    this.saveData();
                    this.updateTotalPomodoros();
                    
                    // 判断是否进入长休息
                    if (this.state.completedRounds % this.config.roundsBeforeLongBreak === 0) {
                        this.switchMode('longBreak');
                    } else {
                        this.switchMode('shortBreak');
                    }
                } else {
                    // 休息结束，回到工作模式
                    this.switchMode('work');
                }
            },

            // 切换模式
            switchMode(mode) {
                this.state.mode = mode;
                this.state.timeLeft = this.config[mode];
                this.pauseTimer(); // 切换模式时暂停
                
                // 更新UI样式
                this.updateTheme();
                this.updateModeButtons();
                this.updateDisplay();
                
                const statusMap = {
                    'work': '准备专注',
                    'shortBreak': '短休息',
                    'longBreak': '长休息'
                };
                this.elements.statusText.textContent = statusMap[mode];
            },

            // 更新主题背景
            updateTheme() {
                const body = this.elements.body;
                body.classList.remove('bg-work', 'bg-short-break', 'bg-long-break');
                
                if (this.state.mode === 'work') {
                    body.classList.add('bg-work');
                } else if (this.state.mode === 'shortBreak') {
                    body.classList.add('bg-short-break');
                } else {
                    body.classList.add('bg-long-break');
                }
            },

            // 更新模式按钮样式
            updateModeButtons() {
                const activeClass = 'bg-white/20 opacity-100';
                const inactiveClass = 'bg-transparent opacity-70';
                
                [this.elements.btnWork, this.elements.btnShort, this.elements.btnLong].forEach(btn => {
                    btn.className = btn.className.replace(activeClass, inactiveClass);
                });

                let activeBtn;
                if (this.state.mode === 'work') activeBtn = this.elements.btnWork;
                else if (this.state.mode === 'shortBreak') activeBtn = this.elements.btnShort;
                else activeBtn = this.elements.btnLong;
                
                activeBtn.className = activeBtn.className.replace(inactiveClass, activeClass);
            },

            // 更新播放/暂停图标
            updatePlayIcon() {
                if (this.state.isRunning) {
                    this.elements.playIcon.classList.remove('fa-play');
                    this.elements.playIcon.classList.add('fa-pause');
                    this.elements.playIcon.classList.remove('pl-1');
                } else {
                    this.elements.playIcon.classList.remove('fa-pause');
                    this.elements.playIcon.classList.add('fa-play');
                    this.elements.playIcon.classList.add('pl-1');
                }
            },

            // 更新计时器显示和进度环
            updateDisplay() {
                const minutes = Math.floor(this.state.timeLeft / 60);
                const seconds = this.state.timeLeft % 60;
                const timeString = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                this.elements.timerDisplay.textContent = timeString;
                document.title = `${timeString} - ${this.state.mode === 'work' ? '专注' : '休息'}`;

                // 更新进度环
                const totalTime = this.config[this.state.mode];
                const progress = this.state.timeLeft / totalTime;
                const circumference = 2 * Math.PI * 45; // r=45
                const offset = circumference - (progress * circumference);
                
                this.elements.progressRing.style.strokeDashoffset = offset;
            },

            // 任务管理：添加任务
            addTask() {
                const input = this.elements.taskInput;
                const text = input.value.trim();
                
                if (!text) return;
                
                const newTask = {
                    id: Date.now(),
                    text: text,
                    completed: false,
                    pomodoros: 0
                };
                
                this.state.tasks.push(newTask);
                
                // 如果没有激活任务，默认激活第一个
                if (!this.state.activeTaskId) {
                    this.state.activeTaskId = newTask.id;
                }
                
                input.value = '';
                this.saveData();
                this.renderTasks();
            },

            // 任务管理：删除任务
            deleteTask(id) {
                this.state.tasks = this.state.tasks.filter(t => t.id !== id);
                if (this.state.activeTaskId === id) {
                    this.state.activeTaskId = this.state.tasks.length > 0 ? this.state.tasks.id : null;
                }
                this.saveData();
                this.renderTasks();
            },

            // 任务管理：切换完成状态
            toggleTaskComplete(id) {
                const task = this.state.tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.saveData();
                    this.renderTasks();
                }
            },

            // 任务管理：激活任务
            activateTask(id) {
                this.state.activeTaskId = id;
                this.saveData();
                this.renderTasks();
            },

            // 渲染任务列表
            renderTasks() {
                const list = this.elements.taskList;
                const emptyState = this.elements.emptyState;
                
                if (this.state.tasks.length === 0) {
                    list.innerHTML = '';
                    list.appendChild(emptyState);
                    emptyState.style.display = 'block';
                    return;
                }
                
                emptyState.style.display = 'none';
                list.innerHTML = '';
                
                this.state.tasks.forEach(task => {
                    const li = document.createElement('li');
                    const isActive = task.id === this.state.activeTaskId;
                    
                    li.className = `task-item flex items-center justify-between p-3 rounded-lg cursor-pointer border ${isActive ? 'bg-white/20 border-white/40' : 'bg-white/5 border-white/10 hover:bg-white/10'}`;
                    li.onclick = (e) => {
                        // 防止点击按钮时触发激活
                        if (!e.target.closest('button')) {
                            this.activateTask(task.id);
                        }
                    };
                    
                    li.innerHTML = `
                        <div class="flex items-center gap-3 overflow-hidden">
                            <button onclick="app.toggleTaskComplete(${task.id})" class="text-white/70 hover:text-white transition-colors">
                                <i class="${task.completed ? 'fa-solid fa-circle-check text-green-300' : 'fa-regular fa-circle'}"></i>
                            </button>
                            <span class="truncate ${task.completed ? 'line-through opacity-50' : ''} ${isActive ? 'font-bold' : ''}">${task.text}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs bg-black/20 px-2 py-0.5 rounded-full">${task.pomodoros} 🍅</span>
                            <button onclick="app.deleteTask(${task.id})" class="text-white/50 hover:text-red-300 transition-colors p-1">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    `;
                    
                    list.appendChild(li);
                });
            },

            // 更新总番茄数显示
            updateTotalPomodoros() {
                this.elements.totalPomodoros.textContent = `今日完成: ${this.state.totalPomodoros} 🍅`;
            },

            // 本地存储：保存
            saveData() {
                localStorage.setItem('pomodoro_state', JSON.stringify({
                    tasks: this.state.tasks,
                    activeTaskId: this.state.activeTaskId,
                    totalPomodoros: this.state.totalPomodoros,
                    completedRounds: this.state.completedRounds
                }));
            },

            // 本地存储：加载
            loadData() {
                const saved = localStorage.getItem('pomodoro_state');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    this.state.tasks = parsed.tasks || [];
                    this.state.activeTaskId = parsed.activeTaskId || null;
                    this.state.totalPomodoros = parsed.totalPomodoros || 0;
                    this.state.completedRounds = parsed.completedRounds || 0;
                    this.updateTotalPomodoros();
                }
            },

            // 桌面通知
            showNotification() {
                if ('Notification' in window && Notification.permission === 'granted') {
                    const title = this.state.mode === 'work' ? '专注时间结束！' : '休息结束！';
                    const body = this.state.mode === 'work' ? '该休息一下了，喝杯水吧。' : '准备好开始下一轮专注了吗？';
                    
                    new Notification(title, {
                        body: body,
                        icon: 'https://cdn-icons-png.flaticon.com/512/3209/3209955.png' // 番茄图标示例
                    });
                }
            },
            
            requestNotificationPermission() {
                if ('Notification' in window && Notification.permission !== 'granted') {
                    Notification.requestPermission();
                }
            }
        };

        // 启动应用
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
